<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body {
      width: 260px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      background-color: #0f172a;
      color: #f8fafc;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .title {
      font-size: 15px;
      font-weight: 700;
      color: #38bdf8;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 42px;
      height: 22px;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #334155;
      transition: 0.3s;
      border-radius: 22px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 16px;
      width: 16px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: 0.3s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #0284c7;
    }
    input:checked + .slider:before {
      transform: translateX(20px);
    }
    .card {
      background-color: #1e293b;
      border-radius: 8px;
      padding: 12px;
      border: 1px solid #334155;
      margin-bottom: 12px;
    }
    .stat-label {
      font-size: 11px;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .stat-value {
      font-size: 22px;
      font-weight: 700;
      color: #f1f5f9;
      margin-top: 4px;
    }
    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #cbd5e1;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #22c55e;
    }
    .dot.disabled {
      background-color: #ef4444;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">Shadow AI Masker</div>
    <label class="switch">
      <input type="checkbox" id="maskingToggle" checked />
      <span class="slider"></span>
    </label>
  </div>

  <div class="card">
    <div class="stat-label">Redacted Tokens (Session)</div>
    <div class="stat-value" id="maskedCount">0</div>
  </div>

  <div class="status-badge">
    <span class="dot" id="statusDot"></span>
    <span id="statusText">Protection Active</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
